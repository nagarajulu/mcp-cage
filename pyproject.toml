[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-cage"
version = "0.4.0"
description = "Zero-Code Wire & Native-Hook Security Firewall for Claude Code, Cursor, Codex, Gemini CLI & MCP (Gitleaks + Little Snitch for AI Coding Agents)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nagarajulu Aerakoni" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-security",
    "agent-security",
    "claude-code",
    "cursor",
    "prompt-injection",
    "llm-security",
    "information-flow-control",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nagarajulu/mcp-cage"
Repository = "https://github.com/nagarajulu/mcp-cage"
Issues = "https://github.com/nagarajulu/mcp-cage/issues"

[project.scripts]
mcp-cage = "mcp_cage_core:main"
mcp-sploit = "mcp_cage_core:main"

[tool.setuptools]
py-modules = ["mcp_cage_core", "mcp_cage_proxy", "mcp_cage_cli"]
