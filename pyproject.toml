[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-cage"
version = "0.4.2"
description = "Zero-Code Wire & Native-Hook Security Firewall for Claude Code, Cursor, Codex, Gemini CLI & MCP (Gitleaks + Little Snitch for AI Coding Agents)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nagarajulu Aerakoni", email = "nagarajulu.a@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "mcp-security",
    "mcp-firewall",
    "mcp-proxy",
    "ai-security",
    "agent-security",
    "agentic-security",
    "llm-security",
    "ai-guardrails",
    "claude-code",
    "cursor",
    "gemini-cli",
    "codex-cli",
    "antigravity",
    "claude-desktop",
    "agent-skills",
    "skill-scanner",
    "prompt-injection",
    "indirect-prompt-injection",
    "xpia",
    "lethal-trifecta",
    "tool-poisoning",
    "mcptox",
    "curxecute",
    "information-flow-control",
    "difc",
    "taint-tracking",
    "secret-scrubbing",
    "ssrf",
    "seatbelt",
    "landlock",
    "owasp-llm",
    "mitre-atlas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nagarajulu/mcp-cage"
Repository = "https://github.com/nagarajulu/mcp-cage"
Issues = "https://github.com/nagarajulu/mcp-cage/issues"

[project.scripts]
mcp-cage = "mcp_cage.cli:main"
mcp-sploit = "mcp_cage.cli:main"

[tool.setuptools]
packages = ["mcp_cage"]
py-modules = ["mcp_cage_core"]
