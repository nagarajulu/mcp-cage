name: CI — mcp-cage Security & Wire Firewall Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python ${{ matrix.python-version }} (Zero-Dependency Stdlib Verification)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run 7-Gate OPSEC, Embargo & Zero-Leak Pre-Commit Scanner (.githooks/pre-commit)
        run: python3 .githooks/pre-commit

      - name: Run Core IFC Lattice, WAL Vault, SSRF/DNS & Config Auditor Suite
        run: python3 tests/unit/test_ifc_lattice_and_wal_vault.py -v

      - name: Run Empirical Guards & Latency Regression Suite
        run: python3 tests/unit/test_empirical_guards.py -v

      - name: Run Wire-DIFC, 4-Slot Canonicalizer & Kernel Sandbox Suite
        run: python3 tests/unit/test_wiredifc_canonicalizer_and_sandbox.py -v

      - name: Run Modular Package & Declarative Enterprise Policy Suite
        run: python3 tests/unit/test_modular_package_and_policy.py -v

      - name: Run 25-Mechanism Empirical CWE Paired-Twin Matrix
        run: python3 tests/cwe_catalog/test_cwe_paired_twin_matrix.py -v

      - name: Run Agentic AI Frameworks & Stdlib Purity Non-Regression Suite
        run: python3 tests/cwe_catalog/test_agentic_ai_frameworks.py -v

      - name: Run Tier 1 8-Plane End-to-End Security Suite
        run: python3 tests/e2e/test_tier1_all_8_planes.py -v

      - name: Run Interactive 5-Act Verification Demo
        run: python3 examples/demo_interactive.py
