name: CI — mcp-cage Security & Wire Firewall Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python ${{ matrix.python-version }} (Zero-Dependency Stdlib Verification)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run 6-Gate OPSEC, Embargo & Zero-Leak Pre-Commit Scanner (.githooks/pre-commit)
        run: python3 .githooks/pre-commit

      - name: Run v0.3.0 Empirical Guards Regression Suite (test_mcp_cage_v30_empirical_guards.py)
        run: python3 test_mcp_cage_v30_empirical_guards.py -v

      - name: Run v0.4.0 Wire-DIFC, 4-Slot Canonicalizer & Kernel Sandbox Suite (test_mcp_cage_v40_wiredifc_and_secbench.py)
        run: python3 test_mcp_cage_v40_wiredifc_and_secbench.py -v

      - name: Run V2.2 Unit & Dual-Plane Security Suite (test_mcp_cage_v21.py)
        run: python3 test_mcp_cage_v21.py -v

      - name: Run 8-Plane End-to-End Security Suite (test_e2e_all_8_planes.py)
        run: python3 test_e2e_all_8_planes.py -v

      - name: Run Agentic AI Toolkits & Cross-Version Non-Regression Suite (test_agentic_ai_tools_and_non_regression.py)
        run: python3 test_agentic_ai_tools_and_non_regression.py -v

      - name: Run 25-Mechanism Empirical CWE Paired-Twin Matrix (test_cwe_empirical_catalog_matrix.py)
        run: python3 test_cwe_empirical_catalog_matrix.py -v

      - name: Run Modular Package & Declarative Enterprise Policy Suite (tests/unit/test_modular_package_and_policy.py)
        run: python3 tests/unit/test_modular_package_and_policy.py -v

      - name: Run Interactive 5-Act Verification Demo (demo_interactive.py)
        run: python3 demo_interactive.py
