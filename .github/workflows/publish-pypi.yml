name: Publish to PyPI (OIDC Trusted Publisher + PEP 740 Attestations)

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Run Security Regression Suites & Build Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify 7-Gate OPSEC Scanner & All Security Regression Suites
        run: |
          python3 .githooks/pre-commit
          python3 tests/unit/test_ifc_lattice_and_wal_vault.py -v
          python3 tests/unit/test_empirical_guards.py -v
          python3 tests/unit/test_wiredifc_canonicalizer_and_sandbox.py -v
          python3 tests/unit/test_modular_package_and_policy.py -v
          python3 tests/cwe_catalog/test_cwe_paired_twin_matrix.py -v
          python3 tests/cwe_catalog/test_agentic_ai_frameworks.py -v
          python3 tests/e2e/test_tier1_all_8_planes.py -v
          python3 examples/demo_interactive.py

      - name: Install build frontend
        run: python3 -m pip install --upgrade build

      - name: Auto-resolve non-colliding PyPI version (PEP 440 post-release if version already exists on PyPI)
        run: |
          python3 -c '
          import json, os, re, urllib.request
          from pathlib import Path
          pyproj = Path("pyproject.toml")
          txt = pyproj.read_text(encoding="utf-8")
          ver = re.search(r"^version\s*=\s*\"([^\"]+)\"", txt, re.M).group(1)
          try:
              with urllib.request.urlopen("https://pypi.org/pypi/mcp-cage/json", timeout=10) as r:
                  published = set(json.loads(r.read().decode()).get("releases", {}).keys())
          except Exception:
              published = set()
          if ver in published:
              run_no = os.environ.get("GITHUB_RUN_NUMBER", "1")
              new_ver = f"{ver}.post{run_no}"
              print(f"Version {ver} already exists on PyPI; stamping PEP 440 post-release {new_ver}")
              pyproj.write_text(re.sub(r"^(version\s*=\s*\")[^\"]+(\")", rf"\g<1>{new_ver}\2", txt, count=1, flags=re.M), encoding="utf-8")
              core = Path("mcp_cage/core.py")
              core.write_text(re.sub(r"^(__version__\s*=\s*\")[^\"]+(\")", rf"\g<1>{new_ver}\2", core.read_text(encoding="utf-8"), count=1, flags=re.M), encoding="utf-8")
          else:
              print(f"Version {ver} is new on PyPI; building {ver} as-is.")
          '

      - name: Build sdist and wheel
        run: python3 -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: Publish mcp-cage to PyPI via OIDC Trusted Publisher
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-cage
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download built distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI with PEP 740 Provenance Attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          skip-existing: true
